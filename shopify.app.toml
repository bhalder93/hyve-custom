# HYV-96: promotions Hyve staff publish to the distributor dashboard.
# Draft/Active is Shopify's own publish switch; the dates decide when an
# active one shows.
[metaobjects.app.promotion]
name = "Promotion"
description = "Promotion artwork and copy shown on the distributor dashboard between its start and end dates"
display_name_field = "title"

[metaobjects.app.promotion.access]
admin = "merchant_read_write"

[metaobjects.app.promotion.capabilities]
publishable = true

[metaobjects.app.promotion.fields.title]
name = "Title"
required = true
type = "single_line_text_field"
validations.max = 80

[metaobjects.app.promotion.fields.artwork]
name = "Artwork"
description = "The promotion image. Landscape works best, about 1200 x 600."
required = true
type = "file_reference"
validations.file_type_options = ["Image"]

[metaobjects.app.promotion.fields.copy]
name = "Copy"
type = "multi_line_text_field"
validations.max = 400

[metaobjects.app.promotion.fields.link]
name = "Button link"
description = "Optional. Where the button goes, such as a collection or product."
type = "url"

[metaobjects.app.promotion.fields.link_label]
name = "Button text"
description = "Shown on the button when there is a link. Leave blank for View promotion."
type = "single_line_text_field"
validations.max = 30

[metaobjects.app.promotion.fields.starts_on]
name = "Starts on"
required = true
type = "date"

[metaobjects.app.promotion.fields.ends_on]
name = "Ends on"
description = "Optional. Leave blank to keep showing it until you set it to Draft."
type = "date"


[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Adds artwork uploaded on the product page to the customer's Saved Artwork
  # library, and records which orders use it (F4).
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  # Closes the order out once it ships, which is what ends the production SLA.
  [[webhooks.subscriptions]]
  uri = "/webhooks/fulfillments/create"
  topics = [ "fulfillments/create" ]

[app_proxy]
# Storefront /apps/account/quote  ->  https://hyve-custom.onrender.com/proxy/quote
# NOTE: `shopify app dev` rewrites this to the dev tunnel; re-deploy to restore production.
url = "https://hyve-custom.onrender.com/proxy"
prefix = "apps"
subpath = "account"

[auth]
redirect_urls = [ "https://hyve-custom.onrender.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true