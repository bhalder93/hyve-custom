query CartDeliveryOptionsTransformRunInput {
  cart {
    # "Cart quote" on a checkout opened from a quote link (HYV-140): those are
    # draft order checkouts, where the duty line can't be added.
    source: attribute(key: "Source") {
      value
    }
    buyerIdentity {
      purchasingCompany{
        company{
          name
        }
      }
      customer {
        id
        
        hasTags(tags: ["B2B_DDP", "B2B_FOB"]) {
          hasTag
          tag
        }
      }
    }
    deliveryGroups {
      id
      deliveryOptions {
        handle
        title
      }
    }
  }
}